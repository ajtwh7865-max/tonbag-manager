<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>톤백 관리대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EEF1EF;
    --surface:#FFFFFF;
    --ink:#1F2A24;
    --muted:#5C6B63;
    --accent-in:#D9480F;
    --full:#D9480F;
    --half:#E8A33D;
    --empty:#7E8A96;
    --border:#D7DBD4;
    --danger:#B3261E;
    --ok:#2F7D4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1020px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:22px;
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--muted);
    text-transform:uppercase;
  }
  h1{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:30px;
    letter-spacing:0.01em;
    margin:2px 0 0;
  }
  .subtitle{
    font-size:13px;
    color:var(--muted);
  }
  .sync-badge{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    background:#fff;
  }
  .sync-badge.connected{border-color:var(--ok); color:var(--ok); background:rgba(47,125,79,0.08);}
  .sync-badge.local{border-color:var(--danger); color:var(--danger); background:rgba(179,38,30,0.06);}

  /* ---- Stats ---- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:24px;
  }
  .stat-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:6px;
    padding:14px 12px 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stat-card .num{
    font-family:'Oswald',sans-serif;
    font-size:26px;
    font-weight:600;
    line-height:1;
  }
  .stat-card .label{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-top:3px;
  }
  .stat-card.total .num{color:var(--ink);}
  .stat-card.full .num{color:var(--full);}
  .stat-card.half .num{color:var(--half);}
  .stat-card.empty .num{color:var(--empty);}

  /* ---- Panel ---- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:18px;
    margin-bottom:24px;
  }
  .panel-title{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:14px;
  }

  .form-grid{
    display:grid;
    grid-template-columns:1fr 1.6fr 1fr;
    gap:14px;
    align-items:end;
  }
  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  .type-toggle{
    display:flex;
    gap:6px;
  }
  .type-toggle button{
    flex:1;
    padding:10px 0;
    border-radius:6px;
    border:1.5px solid var(--border);
    background:#fff;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    white-space:nowrap;
  }
  .type-toggle button.active[data-type="full"]{
    background:rgba(217,72,15,0.1);
    border-color:var(--full);
    color:var(--full);
  }
  .type-toggle button.active[data-type="half"]{
    background:rgba(232,163,61,0.15);
    border-color:var(--half);
    color:#8a5c0f;
  }
  .type-toggle button.active[data-type="empty"]{
    background:rgba(126,138,150,0.15);
    border-color:var(--empty);
    color:#4b545c;
  }
  .qty-stepper{
    display:flex;
    align-items:center;
    border:1.5px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .qty-stepper button{
    width:38px;
    height:40px;
    border:none;
    background:var(--bg);
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
  }
  .qty-stepper input{
    flex:1;
    border:none;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:16px;
    font-weight:600;
    padding:8px 4px;
    width:100%;
    min-width:0;
  }
  .qty-stepper input:focus{outline:none;}
  input[type="date"], input[type="text"]{
    width:100%;
    padding:10px 10px;
    border:1.5px solid var(--border);
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  input[type="date"]:focus, input[type="text"]:focus{
    outline:none;
    border-color:var(--ink);
  }
  .full-row{
    grid-column:1 / -1;
  }
  .submit-btn{
    margin-top:16px;
    width:100%;
    padding:13px 0;
    border:none;
    border-radius:6px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    color:#fff;
    cursor:pointer;
    background:var(--accent-in);
    transition:opacity .12s ease;
  }
  .submit-btn:hover{opacity:0.9;}
  .submit-btn:active{opacity:0.8;}
  .hint{
    font-size:12px;
    color:var(--danger);
    margin-top:8px;
    min-height:16px;
  }

  /* ---- Count breakdown ---- */
  .count-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
  }
  .count-card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:12px;
    text-align:center;
  }
  .count-card .cnum{
    font-family:'Oswald',sans-serif;
    font-size:22px;
    font-weight:600;
    line-height:1;
  }
  .count-card .clabel{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-top:4px;
  }
  .count-card.full .cnum{color:var(--full);}
  .count-card.half .cnum{color:var(--half);}
  .count-card.empty .cnum{color:var(--empty);}
  @media (max-width:640px){
    .count-grid{grid-template-columns:repeat(2,1fr);}
  }

  /* ---- Memo stats ---- */
  .memo-stats-table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  .memo-stats-table th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--muted);
    padding:8px 10px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .memo-stats-table td{
    padding:9px 10px;
    border-bottom:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
  }
  .memo-stats-table tr:last-child td{border-bottom:none;}
  .memo-stats-table td.memo-name{
    font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .memo-stats-table td.num-cell{
    text-align:right;
  }

  /* ---- Log ---- */
  .log-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    flex-wrap:wrap;
    gap:8px;
  }
  .clear-btn{
    padding:7px 14px;
    border-radius:20px;
    border:1.5px solid var(--danger);
    background:#fff;
    font-size:12px;
    font-weight:600;
    color:var(--danger);
    cursor:pointer;
    transition:all .12s ease;
  }
  .clear-btn.confirming{
    background:var(--danger);
    color:#fff;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    overflow:hidden;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--muted);
    padding:10px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    vertical-align:middle;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF8;}
  .no{color:var(--muted);}
  .bagchip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-weight:600;
  }
  .memo-cell{
    font-family:'Inter',sans-serif;
    color:var(--muted);
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:16px;
    padding:2px 6px;
    border-radius:4px;
  }
  .del-btn:hover{color:var(--danger); background:rgba(179,38,30,0.08);}
  .edit-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:15px;
    padding:2px 6px;
    border-radius:4px;
  }
  .edit-btn:hover{color:var(--accent-in); background:rgba(217,72,15,0.08);}
  .status-select{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    padding:5px 8px;
    border-radius:6px;
    border:1.5px solid var(--border);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .status-select:focus{outline:none;}
  .status-select.type-full{border-color:var(--full); color:var(--full);}
  .status-select.type-half{border-color:var(--half); color:#8a5c0f;}
  tr.editing-row{background:rgba(217,72,15,0.06);}
  .cancel-edit-btn{
    margin-top:8px;
    width:100%;
    padding:10px 0;
    border:1.5px solid var(--border);
    border-radius:6px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--muted);
    background:#fff;
    cursor:pointer;
  }
  .cancel-edit-btn:hover{background:var(--bg);}
  .edit-mode-note{
    font-size:12px;
    color:var(--accent-in);
    font-weight:600;
    margin-bottom:10px;
    display:none;
  }
  .edit-mode-note.show{display:block;}
  .empty-row td{
    text-align:center;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    padding:30px 12px;
  }
  .log-scroll{
    max-height:420px;
    overflow-y:auto;
    border-radius:8px;
  }
  .log-scroll table{border-radius:0;}
  .log-scroll thead th{position:sticky; top:0; z-index:1;}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .form-grid{grid-template-columns:1fr;}
    .memo-cell{max-width:100px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Bulk Bag Inventory</div>
      <h1>톤백 관리대장</h1>
      <div class="subtitle">입고 기록 &amp; 현재 재고 현황</div>
      <div class="sync-badge" id="syncBadge">🔄 연결 확인 중…</div>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card total">
      <div>
        <div class="num" id="statTotal">0</div>
        <div class="label">총 재고 (개)</div>
      </div>
    </div>
    <div class="stat-card full">
      <div>
        <div class="num" id="statFull">0</div>
        <div class="label">Full 재고</div>
      </div>
    </div>
    <div class="stat-card half">
      <div>
        <div class="num" id="statHalf">0</div>
        <div class="label">사용 잔량</div>
      </div>
    </div>
    <div class="stat-card empty">
      <div>
        <div class="num" id="statEmpty">0</div>
        <div class="label">빈톤백 재고</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title" id="formPanelTitle">입고 등록</div>
    <div class="edit-mode-note" id="editModeNote">✎ 이 항목을 수정하는 중입니다. 내용을 고친 뒤 "수정 완료"를 누르세요.</div>

    <div class="form-grid">
      <div class="field">
        <label>날짜</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>구분 (내용물 상태)</label>
        <div class="type-toggle">
          <button data-type="full" class="active" onclick="setType('full')">● Full</button>
          <button data-type="half" onclick="setType('half')">◐ 사용</button>
          <button data-type="empty" onclick="setType('empty')">○ 빈백</button>
        </div>
      </div>
      <div class="field">
        <label>수량 (개)</label>
        <div class="qty-stepper">
          <button type="button" onclick="stepQty(-1)">−</button>
          <input type="text" inputmode="numeric" id="fQty" value="1">
          <button type="button" onclick="stepQty(1)">+</button>
        </div>
      </div>
      <div class="field full-row">
        <label>메모 (선택)</label>
        <input type="text" id="fMemo" placeholder="예: 3공장 반입, A현장 등">
      </div>
    </div>

    <div style="font-size:11.5px; color:var(--muted); margin-top:12px;">※ Full / 사용으로 등록하면 같은 수량만큼 빈톤백 재고에서 자동 차감됩니다.</div>
    <button class="submit-btn" id="submitBtn" onclick="submitEntry()">입고 등록</button>
    <button class="cancel-edit-btn" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">수정 취소</button>
    <div class="hint" id="formHint"></div>
  </div>

  <div class="panel">
    <div class="panel-title">등록 건수 (구분별)</div>
    <div class="count-grid">
      <div class="count-card total">
        <div class="cnum" id="cntTotal">0</div>
        <div class="clabel">총 등록 건수</div>
      </div>
      <div class="count-card full">
        <div class="cnum" id="cntFull">0</div>
        <div class="clabel">Full 건수</div>
      </div>
      <div class="count-card half">
        <div class="cnum" id="cntHalf">0</div>
        <div class="clabel">사용 건수</div>
      </div>
      <div class="count-card empty">
        <div class="cnum" id="cntEmpty">0</div>
        <div class="clabel">빈백 건수</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">메모별 통계</div>
    <div class="log-scroll" style="max-height:none;">
      <table class="memo-stats-table" id="memoStatsTable">
        <thead>
          <tr>
            <th>메모</th>
            <th style="text-align:right;">건수</th>
            <th style="text-align:right;">Full</th>
            <th style="text-align:right;">사용</th>
            <th style="text-align:right;">빈백</th>
            <th style="text-align:right;">합계 (개)</th>
          </tr>
        </thead>
        <tbody id="memoStatsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="log-header">
      <div class="panel-title" style="margin-bottom:0;">입고 내역</div>
      <button class="clear-btn" id="clearBtn" onclick="handleClearClick()">전체삭제</button>
    </div>
    <div class="log-scroll">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>날짜</th>
            <th>상태</th>
            <th>수량</th>
            <th>메모</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="logBody">
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
const STORAGE_KEY = 'tonbag_entries'; // Firebase 연결 실패시에만 쓰는 로컬(이 브라우저 전용) 백업 키
const TYPE_LABELS = { full: 'Full', half: '사용', empty: '빈백' };
const TYPE_RATIO = { full: 1, half: 0.5, empty: 0 };
const TYPE_COLOR_VAR = { full: '--full', half: '--half', empty: '--empty' };

let entries = [];
let currentType = 'full';
let clearConfirmTimer = null;
let editingId = null; // 현재 "입고내역"에서 수정 중인 항목의 id (null이면 신규 등록 모드)

/* ============================================================
   FIREBASE (공유 클라우드 저장소)
   - 기기가동 기록서(eqlog-app)와 같은 Firebase 프로젝트를 재사용합니다.
     그 프로젝트의 Firestore 보안규칙이 이미 "모든 문서 읽기/쓰기 허용"으로
     열려 있어서, 여기서는 새 컬렉션("tonbag")만 쓰면 되고 Firebase
     콘솔에서 따로 설정할 게 없습니다.
   - 연결에 실패하면 이 브라우저의 localStorage에만 저장되며(예전 방식과
     동일), 다른 사람/기기와 공유되지 않습니다. 화면 상단 배지로 현재
     상태(공유됨 / 단독 실행)를 항상 보여줍니다.
   - 여러 사람이 동시에 쓰는 경우를 대비해 onSnapshot 실시간 구독을 사용:
     누군가 입고를 등록하면 다른 사람 화면에도 새로고침 없이 바로 반영됩니다.
     (단, 아주 짧은 순간 두 명이 동시에 저장하면 나중 저장이 앞선 저장을
     덮어쓸 수 있습니다 — 소규모 사내 사용 기준으로는 문제되지 않는 수준)
============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBtf8lX15eLMRVKthHEzjl4pJKJTq5gVvk",
  authDomain: "equipment-operation-log.firebaseapp.com",
  projectId: "equipment-operation-log",
  storageBucket: "equipment-operation-log.firebasestorage.app",
  messagingSenderId: "695600318374",
  appId: "1:695600318374:web:795fcf2a3f0179570cf167"
};
let firebaseDb = null;
let useFirebase = false;
let unsubscribeEntries = null;

function tonbagDocRef(){
  return firebaseDb.collection('tonbag').doc('entries');
}
function isFirebaseConfigured(){
  return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
}
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=>reject(new Error('timeout')), ms))
  ]);
}
async function initFirebaseBackend(){
  if(!isFirebaseConfigured()) return false;
  if(typeof firebase === 'undefined' || !firebase.initializeApp) return false;
  for(let attempt=1; attempt<=2; attempt++){
    try{
      if(!firebase.apps || !firebase.apps.length){
        firebase.initializeApp(FIREBASE_CONFIG);
      }
      firebaseDb = firebase.firestore();
      // 연결 확인용 ping. Firestore는 앞뒤로 밑줄 두 개씩인 이름("__xxx__")을
      // 예약어로 취급해 거부하므로, 끝을 밑줄 한 개로 맞춘 안전한 이름을 쓴다.
      await withTimeout(firebaseDb.collection('tonbag').doc('__ping_check_').get(), 5000);
      return true;
    }catch(e){
      console.error(`[톤백 관리대장] Firebase 연결 시도 ${attempt}번째 실패`, e);
      firebaseDb = null;
      if(attempt === 2) return false;
    }
  }
  return false;
}
function updateSyncBadge(){
  const badge = document.getElementById('syncBadge');
  if(!badge) return;
  if(useFirebase){
    badge.textContent = '☁ 공유 저장소 연결됨 — 모든 기기/사용자에게 공유됩니다';
    badge.className = 'sync-badge connected';
  } else {
    badge.textContent = '⚠ 단독 실행 — 이 브라우저에만 저장되어 공유되지 않습니다';
    badge.className = 'sync-badge local';
  }
}

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function sanitizeEntries(list){
  return (Array.isArray(list) ? list : []).filter(e => e && TYPE_LABELS[e.type]);
}

async function loadEntries(){
  // Firebase 모드에서는 subscribeEntries()의 실시간 구독이 entries를 채우고
  // render()도 그쪽에서 호출하므로, 이 함수는 로컬(localStorage) 모드에서만 쓰인다.
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = sanitizeEntries(raw ? JSON.parse(raw) : []);
  }catch(e){
    entries = [];
  }
  render();
}

function subscribeEntries(){
  if(unsubscribeEntries) unsubscribeEntries();
  unsubscribeEntries = tonbagDocRef().onSnapshot(
    snap => {
      const data = snap.exists ? snap.data() : null;
      entries = sanitizeEntries(data && data.entries);
      render();
    },
    err => {
      console.error('[톤백 관리대장] 실시간 동기화 오류', err);
      document.getElementById('formHint').textContent = '공유 저장소와 연결이 끊겼습니다. 새로고침해주세요.';
    }
  );
}

async function saveEntries(){
  if(useFirebase && firebaseDb){
    try{
      await tonbagDocRef().set({ entries, updatedAt: Date.now() });
      // 화면 갱신은 subscribeEntries()의 onSnapshot이 처리한다
      // (다른 사람이 등록한 내용도 똑같은 방식으로 실시간 반영됨)
      return;
    }catch(e){
      console.error('[톤백 관리대장] 공유 저장소 저장 실패', e);
      document.getElementById('formHint').textContent = '공유 저장소 저장에 실패했습니다. 인터넷 연결을 확인해주세요.';
      return;
    }
  }
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(e){
    document.getElementById('formHint').textContent = '저장 중 오류가 발생했습니다. (브라우저 저장공간이 가득 찼거나 시크릿 모드일 수 있어요)';
  }
}

function setType(type){
  currentType = type;
  document.querySelectorAll('.type-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.type === type);
  });
}

function stepQty(delta){
  const input = document.getElementById('fQty');
  let val = parseInt(input.value, 10);
  if(isNaN(val)) val = 0;
  val = Math.max(1, val + delta);
  input.value = val;
}

function getStock(excludeId){
  // 빈톤백 입고는 빈톤백 재고를 늘리고, Full/Half 입고는 빈톤백을 채워서 쓰는 것이므로
  // 빈톤백 재고에서 "항상 1개 단위로" 그만큼 차감한다 (Half라고 해서 0.5개만 차감하지 않음).
  // excludeId를 넘기면 그 항목은 계산에서 제외한다 — 기존 항목을 수정할 때, 그 항목이
  // 이미 반영해둔 차감분을 빼고 "이 항목이 없었다면"의 재고를 기준으로 다시 검사하기 위함.
  let full = 0, half = 0, empty = 0;
  entries.forEach(e=>{
    if(excludeId && e.id === excludeId) return;
    if(e.type === 'full'){ full += e.qty; empty -= e.qty; }
    else if(e.type === 'half'){ half += e.qty; empty -= e.qty; }
    else if(e.type === 'empty'){ empty += e.qty; }
  });
  return { full, half, empty: Math.max(0, empty) };
}

function startEditEntry(id){
  const target = entries.find(e => e.id === id);
  if(!target) return;
  editingId = id;
  document.getElementById('fDate').value = target.date;
  document.getElementById('fQty').value = target.qty;
  document.getElementById('fMemo').value = target.memo || '';
  setType(target.type);
  document.getElementById('formPanelTitle').textContent = '입고 내역 수정';
  document.getElementById('editModeNote').classList.add('show');
  document.getElementById('submitBtn').textContent = '수정 완료';
  document.getElementById('cancelEditBtn').style.display = 'block';
  document.getElementById('formHint').textContent = '';
  document.querySelector('.panel').scrollIntoView({ behavior:'smooth', block:'start' });
}

function exitEditMode(){
  editingId = null;
  document.getElementById('formPanelTitle').textContent = '입고 등록';
  document.getElementById('editModeNote').classList.remove('show');
  document.getElementById('submitBtn').textContent = '입고 등록';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

function cancelEdit(){
  exitEditMode();
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fQty').value = 1;
  document.getElementById('fMemo').value = '';
  setType('full');
  document.getElementById('formHint').textContent = '';
  render();
}

async function submitEntry(){
  const hint = document.getElementById('formHint');
  hint.textContent = '';

  const dateEl = document.getElementById('fDate');
  const qtyEl = document.getElementById('fQty');
  const memoEl = document.getElementById('fMemo');

  const date = dateEl.value || todayStr();
  const qty = parseInt(qtyEl.value, 10);
  const memo = memoEl.value.trim();

  if(!qty || qty <= 0){
    hint.textContent = '수량을 1개 이상 입력해주세요.';
    return;
  }

  if(currentType === 'full' || currentType === 'half'){
    // 수정 모드일 때는 "수정 중인 이 항목 자체"는 재고 계산에서 빼고 검사한다
    // (그렇지 않으면 이미 자기 자신이 차감해둔 만큼 때문에 재고가 부족하다고 잘못 판단됨)
    const stock = getStock(editingId);
    if(qty > stock.empty){
      hint.textContent = `빈톤백 재고 부족: 현재 빈톤백 재고는 ${stock.empty}개입니다. 빈톤백을 먼저 입고하거나 수량을 줄여주세요.`;
      return;
    }
  }

  if(editingId){
    const idx = entries.findIndex(e => e.id === editingId);
    if(idx === -1){
      hint.textContent = '수정할 항목을 찾지 못했습니다. 목록이 바뀌었을 수 있어요 — 다시 시도해주세요.';
      exitEditMode();
      return;
    }
    entries[idx] = { ...entries[idx], date, type: currentType, qty, memo };
    await saveEntries();
    exitEditMode();
  } else {
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
      date,
      type: currentType,
      qty,
      memo,
      createdAt: Date.now()
    };
    entries.push(entry);
    await saveEntries();
  }

  qtyEl.value = 1;
  memoEl.value = '';
  render();
}

async function changeEntryType(selectEl){
  // 입고내역 표에서 드롭다운으로 Full <-> 사용을 바로 전환한다.
  // 두 상태 모두 빈톤백을 수량만큼 1:1로 차감하는 건 동일하므로, 재고 부족 검사 없이
  // 안전하게 종류만 바꿔 저장한다.
  const id = selectEl.dataset.id;
  const newType = selectEl.value;
  const entry = entries.find(e => e.id === id);
  if(!entry || entry.type === newType) return;
  entry.type = newType;
  if(editingId === id){
    // 수정 폼이 이 항목을 열어둔 상태라면 폼의 종류 선택도 같이 맞춰준다
    setType(newType);
  }
  await saveEntries();
  render();
}

async function deleteEntry(id){
  if(editingId === id) cancelEdit();
  entries = entries.filter(e => e.id !== id);
  await saveEntries();
  render();
}

function handleClearClick(){
  const btn = document.getElementById('clearBtn');
  if(btn.classList.contains('confirming')){
    clearTimeout(clearConfirmTimer);
    btn.classList.remove('confirming');
    btn.textContent = '전체삭제';
    clearAllEntries();
  }else{
    btn.classList.add('confirming');
    btn.textContent = '정말 삭제할까요? (다시 클릭)';
    clearConfirmTimer = setTimeout(()=>{
      btn.classList.remove('confirming');
      btn.textContent = '전체삭제';
    }, 3000);
  }
}

async function clearAllEntries(){
  if(editingId) cancelEdit();
  entries = [];
  await saveEntries();
  render();
}

function bagIcon(type, uid){
  const colorVar = `var(${TYPE_COLOR_VAR[type]})`;
  const ratio = TYPE_RATIO[type];
  const top = 4, bottom = 18, totalH = bottom - top;
  const filledH = totalH * ratio;
  const rectY = bottom - filledH;
  const clipId = 'clip-' + uid;
  return `<svg width="16" height="16" viewBox="0 0 20 20" style="flex-shrink:0;">
    <defs>
      <clipPath id="${clipId}">
        <path d="M5 4 L15 4 L17 18 L3 18 Z"/>
      </clipPath>
    </defs>
    <path d="M5 4 L15 4 L17 18 L3 18 Z" fill="none" stroke="${colorVar}" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="3" y="${rectY}" width="14" height="${filledH}" fill="${colorVar}" opacity="0.85" clip-path="url(#${clipId})"/>
  </svg>`;
}

function renderStats(){
  const stock = getStock();
  document.getElementById('statTotal').textContent = stock.full + stock.half + stock.empty;
  document.getElementById('statFull').textContent = stock.full;
  document.getElementById('statHalf').textContent = stock.half;
  document.getElementById('statEmpty').textContent = stock.empty;
}

function renderLog(){
  const tbody = document.getElementById('logBody');

  if(entries.length === 0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="6">기록이 없습니다. 위에서 입고를 등록해보세요.</td></tr>`;
    return;
  }

  // assign stable sequence numbers in chronological (ascending) order
  const chronological = entries.slice().sort((a,b)=> a.createdAt - b.createdAt);
  const noMap = {};
  chronological.forEach((e, idx)=>{ noMap[e.id] = idx + 1; });

  const list = entries.slice().sort((a,b)=> b.createdAt - a.createdAt);

  tbody.innerHTML = list.map(e=>{
    const noStr = String(noMap[e.id]).padStart(4,'0');
    const typeLabel = TYPE_LABELS[e.type] || e.type;
    const rowClass = e.id === editingId ? ' class="editing-row"' : '';
    // Full/사용(half)은 표에서 바로 드롭다운으로 상태를 바꿀 수 있다 (수량은 그대로
    // 유지되고, Full<->사용 전환은 빈톤백 차감량이 동일해서 재고 검사가 필요 없다).
    // 빈백은 별도 항목(빈 자루 입고 자체)이라 이 드롭다운 대상에서 제외한다.
    const statusCell = (e.type === 'full' || e.type === 'half')
      ? `<select class="status-select type-${e.type}" data-id="${e.id}" onchange="changeEntryType(this)">
          <option value="full" ${e.type==='full' ? 'selected' : ''}>● Full</option>
          <option value="half" ${e.type==='half' ? 'selected' : ''}>◐ 사용</option>
        </select>`
      : `<span class="bagchip">${bagIcon(e.type, e.id)} ${typeLabel}</span>`;
    return `<tr${rowClass}>
      <td class="no">#${noStr}</td>
      <td>${e.date}</td>
      <td>${statusCell}</td>
      <td>${e.qty}개</td>
      <td class="memo-cell">${e.memo ? e.memo : '—'}</td>
      <td>
        <button class="edit-btn" onclick="startEditEntry('${e.id}')" title="수정">✎</button>
        <button class="del-btn" onclick="deleteEntry('${e.id}')" title="삭제">✕</button>
      </td>
    </tr>`;
  }).join('');
}

function renderCounts(){
  // 등록 "건수" = 몇 번 입력했는지(레코드 개수). 재고 수량(qty 합계)과는 다른 지표입니다.
  const counts = { full: 0, half: 0, empty: 0 };
  entries.forEach(e=>{ if(counts.hasOwnProperty(e.type)) counts[e.type]++; });
  document.getElementById('cntTotal').textContent = entries.length;
  document.getElementById('cntFull').textContent = counts.full;
  document.getElementById('cntHalf').textContent = counts.half;
  document.getElementById('cntEmpty').textContent = counts.empty;
}

function renderMemoStats(){
  const tbody = document.getElementById('memoStatsBody');
  const groups = {}; // memoKey -> { count, full, half, empty, total }

  entries.forEach(e=>{
    const key = e.memo && e.memo.trim() ? e.memo.trim() : '(메모 없음)';
    if(!groups[key]) groups[key] = { count:0, full:0, half:0, empty:0, total:0 };
    groups[key].count += 1;
    groups[key][e.type] += e.qty;
    groups[key].total += e.qty;
  });

  const keys = Object.keys(groups).sort((a,b)=> groups[b].total - groups[a].total);

  if(keys.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted); font-family:'Inter',sans-serif; padding:20px 10px;">기록이 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = keys.map(key=>{
    const g = groups[key];
    return `<tr>
      <td class="memo-name">${key}</td>
      <td class="num-cell">${g.count}건</td>
      <td class="num-cell">${g.full}</td>
      <td class="num-cell">${g.half}</td>
      <td class="num-cell">${g.empty}</td>
      <td class="num-cell"><strong>${g.total}개</strong></td>
    </tr>`;
  }).join('');
}

function render(){
  renderStats();
  renderCounts();
  renderMemoStats();
  renderLog();
}

document.getElementById('fDate').value = todayStr();
(async function bootstrap(){
  useFirebase = await initFirebaseBackend();
  updateSyncBadge();
  if(useFirebase){
    subscribeEntries();
  } else {
    await loadEntries();
  }
})();
</script>
</body>
</html>
